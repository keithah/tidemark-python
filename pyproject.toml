[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidemark"
version = "0.1.1"
description = "Python port of tidemark ad marker detection."
readme = "tidemark-python-gsd.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "tidemark contributors" },
]
dependencies = ["imageio-ffmpeg>=0.5", "mutagen>=1.47", "threefive>=3.0", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pyinstaller>=6", "pyaes>=1.6", "pytest"]
fingerprint = ["pyacoustid>=1.3"]

[project.scripts]
tidemark = "tidemark.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "real_parity: opt-in side-by-side parity against a private/live stream URL from TIDEMARK_PARITY_REAL_URL",
    "udp_parity: opt-in side-by-side UDP parity proof requiring multicast-capable local networking",
]
