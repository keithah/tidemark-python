[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidemark"
version = "0.0.0"
description = "Python port of tidemark ad marker detection."
readme = "tidemark-python-gsd.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "tidemark contributors" },
]
dependencies = ["mutagen>=1.47", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tidemark = "tidemark.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
