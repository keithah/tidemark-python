name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            exe: tidemark
          - os: macos-15
            platform: macos-arm64
            exe: tidemark
          - os: macos-13
            platform: macos-x86_64
            exe: tidemark
          - os: windows-latest
            platform: windows-x86_64
            exe: tidemark.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Build executable
        run: pyinstaller tidemark.spec

      - name: Rename artifact
        shell: bash
        run: |
          src="dist/${{ matrix.exe }}"
          dst="dist/tidemark-${{ matrix.platform }}"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            dst="${dst}.exe"
          fi
          mv "$src" "$dst"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tidemark-${{ matrix.platform }}
          path: dist/tidemark-${{ matrix.platform }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
