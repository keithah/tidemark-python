name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            exe: tidemark
          - os: macos-15
            platform: macos-arm64
            exe: tidemark
          - os: windows-latest
            platform: windows-x86_64
            exe: tidemark.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Install Linux static wrapping tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y patchelf squashfs-tools

      - name: Build executable
        run: pyinstaller tidemark.spec

      - name: Rename artifact
        shell: bash
        run: |
          src="dist/${{ matrix.exe }}"
          dst="dist/tidemark-${{ matrix.platform }}"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            dst="${dst}.exe"
          fi
          mv "$src" "$dst"

      - name: Statically wrap Linux artifact
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          bin="dist/tidemark-linux-x86_64"
          staticx "$bin" "${bin}.static"
          mv "${bin}.static" "$bin"
          ldd "$bin" > /tmp/tidemark-linux-ldd.txt 2>&1 || true
          cat /tmp/tidemark-linux-ldd.txt
          grep -q "not a dynamic executable" /tmp/tidemark-linux-ldd.txt

      - name: Smoke test binary
        shell: bash
        run: |
          bin="dist/tidemark-${{ matrix.platform }}"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            bin="${bin}.exe"
          fi
          "$bin" --version
          "$bin" doctor || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tidemark-${{ matrix.platform }}
          path: dist/tidemark-${{ matrix.platform }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
