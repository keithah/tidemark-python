name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'

      - name: Run tests
        env:
          NO_COLOR: "1"
        run: .venv/bin/pytest
